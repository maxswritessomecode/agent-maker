<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Agent Maker sample output preview">
  <rect width="1200" height="675" fill="#f7f7f2"/>
  <rect x="72" y="58" width="1056" height="559" rx="18" fill="#ffffff" stroke="#d8d8cf"/>
  <text x="112" y="124" fill="#151515" font-family="Arial, sans-serif" font-size="42" font-weight="700">Agent Maker</text>
  <text x="112" y="166" fill="#4a4a43" font-family="Arial, sans-serif" font-size="23">Recommend safe AI agent candidates from approved work context.</text>
  <rect x="112" y="218" width="976" height="105" rx="12" fill="#111111"/>
  <text x="140" y="258" fill="#f6f6ee" font-family="Menlo, Consolas, monospace" font-size="21">Use $agent-maker to inspect approved work context from the last 10 days.</text>
  <text x="140" y="292" fill="#c9c9bd" font-family="Menlo, Consolas, monospace" font-size="19">Start metadata-first. Recommend 1-3 draft-only agent candidates.</text>
  <rect x="112" y="362" width="456" height="174" rx="12" fill="#eef3ff" stroke="#c4d4ff"/>
  <text x="140" y="405" fill="#172033" font-family="Arial, sans-serif" font-size="26" font-weight="700">1. Status Update Assistant</text>
  <text x="140" y="443" fill="#29334a" font-family="Arial, sans-serif" font-size="21">Opportunity: 5/5</text>
  <text x="140" y="477" fill="#29334a" font-family="Arial, sans-serif" font-size="21">Risk: low, draft-only</text>
  <text x="140" y="511" fill="#29334a" font-family="Arial, sans-serif" font-size="21">Sources: email, docs, tickets, chat</text>
  <rect x="632" y="362" width="456" height="174" rx="12" fill="#f0f8ef" stroke="#c9dec5"/>
  <text x="660" y="405" fill="#1e3220" font-family="Arial, sans-serif" font-size="26" font-weight="700">2. Meeting Follow-up Coordinator</text>
  <text x="660" y="443" fill="#2c432f" font-family="Arial, sans-serif" font-size="21">Opportunity: 4/5</text>
  <text x="660" y="477" fill="#2c432f" font-family="Arial, sans-serif" font-size="21">Risk: low, human review</text>
  <text x="660" y="511" fill="#2c432f" font-family="Arial, sans-serif" font-size="21">Sources: calendar, notes, Teams</text>
  <text x="112" y="582" fill="#595951" font-family="Arial, sans-serif" font-size="20">Metadata first. Approved sources only. No autonomous actions.</text>
</svg>
